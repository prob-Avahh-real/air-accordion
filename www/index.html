<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1a0c10"/>
<title>空气手风琴 · Air Accordion</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --wine:#2a1218;
  --wine-deep:#1a0c10;
  --brass:#d4a84b;
  --brass-dim:#8a6a2e;
  --bellows:#1e4a45;
  --bellows-lit:#2f6b63;
  --cream:#f3e6c8;
  --ink:#1a0c10;
  --glow:rgba(212,168,75,.35);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
html,body{height:100%;overflow:hidden;background:var(--wine-deep);color:var(--cream);font-family:Figtree,sans-serif}
body{
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(212,168,75,.18), transparent 55%),
    radial-gradient(90% 70% at 80% 100%, rgba(30,74,69,.35), transparent 50%),
    linear-gradient(165deg, #3a1a22 0%, #1a0c10 48%, #12201e 100%);
}

#app{height:100%;display:flex;flex-direction:column;position:relative}

/* —— Start —— */
#start{
  position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:calc(1.5rem + var(--safe-top)) 1.25rem calc(1.5rem + var(--safe-bottom));
  text-align:center;
  background:
    radial-gradient(ellipse 80% 50% at 50% 30%, rgba(212,168,75,.2), transparent 60%),
    linear-gradient(180deg, rgba(26,12,16,.55), rgba(26,12,16,.92));
  transition:opacity .5s ease,visibility .5s;
}
#start.hidden{opacity:0;visibility:hidden;pointer-events:none}
#start .hero-mark{
  width:min(72vw,280px);height:min(42vw,160px);margin-bottom:1.4rem;
  filter:drop-shadow(0 12px 28px rgba(0,0,0,.45));
  animation:breathe 3.2s ease-in-out infinite;
}
#start h1{
  font-family:Fraunces,serif;font-weight:700;font-size:clamp(2.4rem,10vw,3.6rem);
  letter-spacing:.04em;line-height:1.05;color:var(--cream);
  text-shadow:0 2px 24px rgba(212,168,75,.25);
}
#start .en{
  margin-top:.35rem;font-size:.85rem;letter-spacing:.28em;text-transform:uppercase;
  color:var(--brass);font-weight:500;
}
#start .tag{
  margin-top:1.1rem;max-width:18rem;font-size:.95rem;line-height:1.45;
  color:rgba(243,230,200,.78);font-weight:400;
}
#start .cta{
  margin-top:1.8rem;display:flex;flex-direction:column;gap:.7rem;align-items:center;width:100%;max-width:16rem;
}
button.primary{
  width:100%;border:0;border-radius:999px;padding:.95rem 1.4rem;
  background:linear-gradient(135deg, #e0b85a, #b8862e);
  color:var(--ink);font-family:Figtree,sans-serif;font-weight:700;font-size:1.05rem;
  box-shadow:0 8px 28px rgba(212,168,75,.35);cursor:pointer;
  transition:transform .15s ease,filter .15s;
}
button.primary:active{transform:scale(.97);filter:brightness(.95)}
button.ghost{
  background:transparent;border:1px solid rgba(212,168,75,.45);color:var(--brass);
  border-radius:999px;padding:.7rem 1.2rem;font-family:Figtree,sans-serif;font-weight:600;font-size:.85rem;cursor:pointer;
}
.hint{margin-top:1.25rem;font-size:.72rem;color:rgba(243,230,200,.45);line-height:1.5;max-width:18rem}

/* —— Play chrome —— */
#play{flex:1;display:flex;flex-direction:column;padding:calc(.55rem + var(--safe-top)) .7rem calc(.55rem + var(--safe-bottom));min-height:0;opacity:0;pointer-events:none;transition:opacity .45s}
#play.on{opacity:1;pointer-events:auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-shrink:0}
.brand-mini{font-family:Fraunces,serif;font-size:1rem;color:var(--brass);letter-spacing:.06em}
.status-row{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:flex-end}
.chip{
  font-size:.58rem;padding:.18rem .45rem;border-radius:999px;
  border:1px solid rgba(212,168,75,.25);color:rgba(243,230,200,.55);background:rgba(0,0,0,.25);
  display:none;align-items:center;gap:.2rem;cursor:default;
}
.chip.show{display:flex}
.chip.active{color:#7ec8be;border-color:#3d8a7f;background:rgba(30,74,69,.45)}
.chip.need{display:flex;cursor:pointer;color:var(--brass);border-color:rgba(212,168,75,.5)}

.meter{
  margin-top:.45rem;height:.35rem;border-radius:999px;background:rgba(0,0,0,.35);
  overflow:hidden;position:relative;flex-shrink:0;
}
.meter > i{
  position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--brass);
  transform:translateX(-50%);
  transition:left .08s linear,width .08s linear;
  box-shadow:0 0 10px var(--glow);
}

/* —— Bellows —— */
.stage{
  flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  position:relative;margin:.35rem 0;
}
.accordion{
  width:min(92vw,420px);aspect-ratio:1.55/1;position:relative;
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.5));
}
.accordion svg{width:100%;height:100%;display:block}
.bellows-fold{transition:transform .05s linear}
.note-flash{
  position:absolute;left:50%;top:12%;transform:translateX(-50%);
  font-family:Fraunces,serif;font-size:1.6rem;color:var(--brass);
  opacity:0;pointer-events:none;transition:opacity .15s;
  text-shadow:0 0 20px var(--glow);
}
.note-flash.on{opacity:1}
.dir-label{
  position:absolute;bottom:6%;left:50%;transform:translateX(-50%);
  font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(243,230,200,.4);
}

/* —— Keys —— */
.boards{
  display:grid;grid-template-columns:1fr 1.35fr;gap:.45rem;flex-shrink:0;
  max-height:42vh;
}
.panel{display:flex;flex-direction:column;gap:.35rem;min-height:0}
.panel h2{
  font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(212,168,75,.7);font-weight:600;padding-left:.15rem;
}
.bass-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:.35rem;flex:1;
}
.bass-btn,.mel-btn{
  border:0;border-radius:.7rem;cursor:pointer;font-family:Figtree,sans-serif;
  color:var(--cream);position:relative;overflow:hidden;
  transition:transform .08s,filter .08s,box-shadow .08s;
}
.bass-btn{
  background:linear-gradient(160deg,#3d242c,#26141a);
  border:1px solid rgba(212,168,75,.28);
  font-weight:700;font-size:.95rem;min-height:3.2rem;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.bass-btn small{display:block;font-size:.58rem;font-weight:500;opacity:.55;margin-top:.1rem}
.bass-btn.on,.mel-btn.on{
  filter:brightness(1.15);
  box-shadow:0 0 0 2px var(--brass), 0 0 18px var(--glow);
  transform:scale(.97);
}
.mel-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:.28rem;flex:1;
}
.mel-btn{
  background:linear-gradient(160deg,#f0e2c0,#d4c19a);
  color:var(--ink);font-weight:700;font-size:.85rem;min-height:2.6rem;
  border:1px solid rgba(138,106,46,.35);
}
.mel-btn.blackish{
  background:linear-gradient(160deg,#4a3038,#2a181e);
  color:var(--cream);border-color:rgba(212,168,75,.2);
}
.footer-keys{
  margin-top:.4rem;display:flex;justify-content:center;gap:.4rem;flex-shrink:0;
}
.mini{
  border:1px solid rgba(212,168,75,.3);background:rgba(0,0,0,.25);color:rgba(243,230,200,.7);
  border-radius:999px;padding:.35rem .7rem;font-size:.65rem;font-family:Figtree,sans-serif;cursor:pointer;
}
.mini.on{color:var(--brass);border-color:var(--brass)}

@keyframes breathe{
  0%,100%{transform:scale(1) translateY(0)}
  50%{transform:scale(1.03) translateY(-4px)}
}

/* Watch / smart hardware */
@media (max-width:280px),(max-height:300px){
  #start h1{font-size:1.35rem}
  #start .en{font-size:.55rem;letter-spacing:.16em}
  #start .tag{font-size:.65rem;margin-top:.5rem}
  #start .hero-mark{width:42vw;height:24vw;margin-bottom:.5rem}
  #start .cta{margin-top:.7rem;max-width:90%}
  button.primary{padding:.55rem .8rem;font-size:.75rem}
  button.ghost{padding:.4rem .7rem;font-size:.6rem}
  .hint{display:none}
  .brand-mini{font-size:.7rem}
  .chip{font-size:.45rem;padding:.1rem .3rem}
  .stage{margin:.15rem 0}
  .boards{max-height:48vh;gap:.25rem}
  .panel h2{font-size:.45rem}
  .bass-btn{min-height:1.8rem;font-size:.65rem;border-radius:.4rem}
  .bass-btn small{font-size:.4rem}
  .mel-btn{min-height:1.5rem;font-size:.55rem;border-radius:.35rem}
  .note-flash{font-size:.9rem}
  .dir-label{font-size:.45rem}
  .meter{height:.22rem}
  .mini{font-size:.5rem;padding:.2rem .45rem}
}
@media (max-height:520px) and (min-width:281px){
  .bass-btn{min-height:2.6rem}
  .mel-btn{min-height:2.2rem}
}
</style>
</head>
<body>
<div id="app">
  <section id="start">
    <svg class="hero-mark" viewBox="0 0 280 160" aria-hidden="true">
      <defs>
        <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#5a2a32"/><stop offset="100%" stop-color="#2a1218"/>
        </linearGradient>
        <linearGradient id="bel" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2f6b63"/><stop offset="100%" stop-color="#1a3d39"/>
        </linearGradient>
      </defs>
      <rect x="18" y="28" width="52" height="104" rx="8" fill="url(#wood)" stroke="#d4a84b" stroke-width="2"/>
      <rect x="210" y="28" width="52" height="104" rx="8" fill="url(#wood)" stroke="#d4a84b" stroke-width="2"/>
      <g id="hero-folds">
        <rect x="70" y="40" width="140" height="80" rx="4" fill="url(#bel)"/>
        <path d="M78 48 V112 M92 42 V118 M106 48 V112 M120 42 V118 M134 48 V112 M148 42 V118 M162 48 V112 M176 42 V118 M190 48 V112" stroke="#0f2a27" stroke-width="3" opacity=".55"/>
        <path d="M78 48 V112 M92 42 V118 M106 48 V112 M120 42 V118 M134 48 V112 M148 42 V118 M162 48 V112 M176 42 V118 M190 48 V112" stroke="#4a9a8e" stroke-width="1" opacity=".35"/>
      </g>
      <circle cx="44" cy="80" r="10" fill="#d4a84b" opacity=".85"/>
      <circle cx="236" cy="64" r="5" fill="#d4a84b"/><circle cx="236" cy="80" r="5" fill="#d4a84b"/><circle cx="236" cy="96" r="5" fill="#d4a84b"/>
    </svg>
    <h1>空气手风琴</h1>
    <p class="en">Air Accordion</p>
    <p class="tag">在空气中推拉风箱，用触控与手势奏出簧片之声。</p>
    <div class="cta">
      <button class="primary" id="btn-start">开始演奏</button>
      <button class="ghost" id="btn-motion">启用动作传感器</button>
    </div>
    <p class="hint">倾斜推拉风箱才有气（静止无声）· 左侧和弦 · 右侧旋律<br/>戒指倾斜选音 · 摇确认 · 手杖点按发声 / 挥动推风箱</p>
  </section>

  <section id="play">
    <div class="topbar">
      <div class="brand-mini">空气手风琴</div>
      <div class="status-row">
        <div class="chip" id="ring-status">💍</div>
        <div class="chip" id="cane-status">🦯</div>
        <div class="chip show" id="oct-chip">八度 0</div>
        <div class="chip show" id="sus-chip">持续 关</div>
      </div>
    </div>
    <div class="meter" aria-hidden="true"><i id="bellows-meter"></i></div>

    <div class="stage">
      <div class="accordion" id="accordion">
        <svg viewBox="0 0 400 260" aria-hidden="true">
          <defs>
            <linearGradient id="wood2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#6b3440"/><stop offset="100%" stop-color="#2a1218"/>
            </linearGradient>
            <linearGradient id="bel2" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#1e4a45"/><stop offset="50%" stop-color="#2f6b63"/><stop offset="100%" stop-color="#1e4a45"/>
            </linearGradient>
          </defs>
          <rect x="28" y="40" width="70" height="180" rx="10" fill="url(#wood2)" stroke="#d4a84b" stroke-width="2.5"/>
          <rect x="302" y="40" width="70" height="180" rx="10" fill="url(#wood2)" stroke="#d4a84b" stroke-width="2.5"/>
          <g id="folds-group" transform="translate(0 0)">
            <rect id="bellows-body" x="98" y="58" width="204" height="144" rx="6" fill="url(#bel2)"/>
            <g id="fold-lines" stroke="#0d2421" stroke-width="4" opacity=".5"></g>
            <g id="fold-hi" stroke="#5eb5a8" stroke-width="1.2" opacity=".35"></g>
          </g>
          <circle cx="63" cy="130" r="16" fill="#d4a84b" opacity=".9"/>
          <circle cx="63" cy="130" r="7" fill="#2a1218"/>
          <g fill="#d4a84b">
            <circle cx="337" cy="90" r="7"/><circle cx="337" cy="130" r="7"/><circle cx="337" cy="170" r="7"/>
          </g>
        </svg>
        <div class="note-flash" id="note-flash">—</div>
        <div class="dir-label" id="dir-label">PUSH</div>
      </div>
    </div>

    <div class="boards">
      <div class="panel">
        <h2>Bass · 和弦</h2>
        <div class="bass-grid" id="bass-grid"></div>
      </div>
      <div class="panel">
        <h2>Melody · 旋律</h2>
        <div class="mel-grid" id="mel-grid"></div>
      </div>
    </div>
    <div class="footer-keys">
      <button class="mini" id="btn-sustain" type="button">持续 Sustain</button>
      <button class="mini" id="btn-oct-down" type="button">八度 −</button>
      <button class="mini" id="btn-oct-up" type="button">八度 +</button>
    </div>
  </section>
</div>

<script>
(() => {
  'use strict';

  // —— Tuning ——
  const A4 = 440;
  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  function midiToFreq(m){ return A4 * Math.pow(2, (m - 69) / 12); }
  function noteLabel(m){ return NOTE_NAMES[((m % 12) + 12) % 12] + Math.floor(m / 12 - 1); }

  // C major diatonic melody (C4–C5) + one accidental row helper via ring
  const MELODY = [
    { midi: 60, label: 'C',  cls: '' },
    { midi: 62, label: 'D',  cls: '' },
    { midi: 64, label: 'E',  cls: '' },
    { midi: 65, label: 'F',  cls: '' },
    { midi: 67, label: 'G',  cls: '' },
    { midi: 69, label: 'A',  cls: '' },
    { midi: 71, label: 'B',  cls: '' },
    { midi: 72, label: 'C5', cls: '' },
    { midi: 61, label: 'C#', cls: 'blackish' },
    { midi: 63, label: 'D#', cls: 'blackish' },
    { midi: 66, label: 'F#', cls: 'blackish' },
    { midi: 68, label: 'G#', cls: 'blackish' },
  ];

  // Accordion-style bass: root + major/minor triads
  const BASS = [
    { id: 'C',  label: 'C',  sub: 'I 大调',  notes: [48, 52, 55] },
    { id: 'F',  label: 'F',  sub: 'IV',      notes: [53, 57, 60] },
    { id: 'G',  label: 'G',  sub: 'V',       notes: [55, 59, 62] },
    { id: 'Am', label: 'Am', sub: 'vi 小调', notes: [57, 60, 64] },
    { id: 'Dm', label: 'Dm', sub: 'ii',      notes: [50, 53, 57] },
    { id: 'Em', label: 'Em', sub: 'iii',     notes: [52, 55, 59] },
    { id: 'Bb', label: 'Bb', sub: 'bVII',    notes: [46, 50, 53] },
    { id: 'G7', label: 'G7', sub: '属七',    notes: [55, 59, 62, 65] },
  ];

  // —— State ——
  const state = {
    playing: false,
    bellows: 0,       // -1..1  (neg=pull, pos=push)
    volume: 0.15,
    octave: 0,
    sustain: false,
    ringNoteIdx: 0,
    direction: 1,     // 1 push, -1 pull
  };

  // —— Audio ——
  let ctx = null;
  let master = null;
  let bellowsGain = null;
  let vibratoLFO = null;
  let vibratoGain = null;
  const voices = new Map(); // key -> { stop }

  function ensureAudio() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.85;
    master.connect(ctx.destination);

    bellowsGain = ctx.createGain();
    bellowsGain.gain.value = 0.0001;
    bellowsGain.connect(master);

    vibratoLFO = ctx.createOscillator();
    vibratoGain = ctx.createGain();
    vibratoLFO.frequency.value = 5.2;
    vibratoGain.gain.value = 4.5;
    vibratoLFO.connect(vibratoGain);
    vibratoLFO.start();
  }

  function reedVoice(freq, dest, soft) {
    const t = ctx.currentTime;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(soft ? 0.12 : 0.18, t + 0.03);
    g.connect(dest);

    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = freq * (state.direction > 0 ? 1.8 : 1.4);
    filter.Q.value = soft ? 3.5 : 5.5;
    filter.connect(g);

    const oscs = [];
    const dets = soft ? [0, 3.2, -2.6] : [0, 4.5, -3.8, 7.2];
    const types = soft ? ['sawtooth', 'triangle', 'sawtooth'] : ['sawtooth', 'sawtooth', 'triangle', 'square'];
    const gains = soft ? [0.45, 0.35, 0.22] : [0.38, 0.28, 0.22, 0.08];

    dets.forEach((det, i) => {
      const o = ctx.createOscillator();
      o.type = types[i];
      o.frequency.value = freq;
      o.detune.value = det + (state.direction > 0 ? 1.5 : -1.5);
      const og = ctx.createGain();
      og.gain.value = gains[i];
      o.connect(og);
      og.connect(filter);
      vibratoGain.connect(o.detune);
      o.start(t);
      oscs.push(o);
    });

    // soft noise breath for reed air
    const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.15;
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuf;
    noise.loop = true;
    const ng = ctx.createGain();
    ng.gain.value = soft ? 0.015 : 0.03;
    const nf = ctx.createBiquadFilter();
    nf.type = 'highpass';
    nf.frequency.value = 1200;
    noise.connect(nf); nf.connect(ng); ng.connect(g);
    noise.start(t);

    return {
      stop(release = 0.18) {
        const now = ctx.currentTime;
        try {
          g.gain.cancelScheduledValues(now);
          g.gain.setValueAtTime(g.gain.value, now);
          g.gain.linearRampToValueAtTime(0.0001, now + release);
        } catch (_) {}
        setTimeout(() => {
          oscs.forEach(o => { try { o.stop(); } catch (_) {} });
          try { noise.stop(); } catch (_) {}
        }, (release + 0.05) * 1000);
      }
    };
  }

  function voiceKey(kind, id) { return kind + ':' + id; }

  function startNote(kind, id, midis, soft) {
    ensureAudio();
    if (ctx.state === 'suspended') ctx.resume();
    const key = voiceKey(kind, id);
    if (voices.has(key)) {
      if (state.sustain) return;
      voices.get(key).stop(0.05);
      voices.delete(key);
    }
    const octaveShift = kind === 'mel' ? state.octave * 12 : 0;
    const bundle = midis.map(m => reedVoice(midiToFreq(m + octaveShift), bellowsGain, soft));
    voices.set(key, {
      stop(r) { bundle.forEach(v => v.stop(r)); }
    });
    const label = midis.length > 1 ? id : noteLabel(midis[0] + octaveShift);
    flashNote(label);
  }

  function stopNote(kind, id) {
    const key = voiceKey(kind, id);
    if (!voices.has(key)) return;
    if (state.sustain) return;
    voices.get(key).stop(0.2);
    voices.delete(key);
  }

  function stopAll() {
    voices.forEach(v => v.stop(0.15));
    voices.clear();
  }

  function updateBellowsAudio() {
    if (!bellowsGain || !ctx) return;
    // AND-gate: no bellows motion / open → silence (no floor, no idle air)
    const absB = Math.abs(state.bellows);
    const dead = 0.12;
    let target = 0.0001;
    if (absB > dead) {
      const mag = Math.min(1, (absB - dead) / (1 - dead));
      target = 0.08 + mag * 0.55;
    }
    const now = ctx.currentTime;
    bellowsGain.gain.setTargetAtTime(target, now, 0.05);
    if (vibratoLFO) {
      vibratoLFO.frequency.setTargetAtTime(state.direction > 0 ? 5.5 : 4.2, now, 0.1);
    }
  }

  // —— UI builders ——
  const bassGrid = document.getElementById('bass-grid');
  const melGrid = document.getElementById('mel-grid');
  const bassEls = {};
  const melEls = {};

  BASS.forEach(b => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'bass-btn';
    btn.innerHTML = `${b.label}<small>${b.sub}</small>`;
    btn.dataset.id = b.id;
    bindPress(btn,
      () => { btn.classList.add('on'); startNote('bass', b.id, b.notes, true); },
      () => { btn.classList.remove('on'); stopNote('bass', b.id); }
    );
    bassGrid.appendChild(btn);
    bassEls[b.id] = btn;
  });

  MELODY.forEach((n, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mel-btn' + (n.cls ? ' ' + n.cls : '');
    btn.textContent = n.label;
    btn.dataset.idx = String(i);
    bindPress(btn,
      () => { btn.classList.add('on'); startNote('mel', n.label, [n.midi], false); },
      () => { btn.classList.remove('on'); stopNote('mel', n.label); }
    );
    melGrid.appendChild(btn);
    melEls[n.label] = btn;
  });

  function bindPress(el, down, up) {
    const onDown = e => { e.preventDefault(); down(); };
    const onUp = e => { e.preventDefault(); up(); };
    el.addEventListener('pointerdown', onDown);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onUp);
    el.addEventListener('pointerleave', e => {
      if (e.buttons === 0) up();
    });
  }

  // fold lines
  const foldLines = document.getElementById('fold-lines');
  const foldHi = document.getElementById('fold-hi');
  for (let i = 0; i < 12; i++) {
    const x = 108 + i * 16;
    const y1 = 66 + (i % 2) * 6;
    const y2 = 194 - (i % 2) * 6;
    const a = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    a.setAttribute('x1', x); a.setAttribute('x2', x);
    a.setAttribute('y1', y1); a.setAttribute('y2', y2);
    foldLines.appendChild(a);
    const b = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    b.setAttribute('x1', x); b.setAttribute('x2', x);
    b.setAttribute('y1', y1); b.setAttribute('y2', y2);
    foldHi.appendChild(b);
  }

  const bellowsBody = document.getElementById('bellows-body');
  const foldsGroup = document.getElementById('folds-group');
  const meter = document.getElementById('bellows-meter');
  const dirLabel = document.getElementById('dir-label');
  const noteFlash = document.getElementById('note-flash');
  let flashTimer = 0;

  function flashNote(text) {
    noteFlash.textContent = text;
    noteFlash.classList.add('on');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => noteFlash.classList.remove('on'), 450);
  }

  function renderBellows() {
    const b = state.bellows; // -1..1
    const open = 0.72 + Math.abs(b) * 0.28;
    const w = 204 * open;
    const x = 98 - (w - 204) / 2;
    bellowsBody.setAttribute('width', w);
    bellowsBody.setAttribute('x', x);
    const scaleX = open;
    foldsGroup.setAttribute('transform', `translate(${(1 - scaleX) * -50},0) scale(${scaleX},1)`);

    const pct = ((b + 1) / 2) * 100;
    const width = Math.max(4, Math.abs(b) * 48);
    meter.style.left = pct + '%';
    meter.style.width = width + 'px';

    state.direction = b >= 0 ? 1 : -1;
    dirLabel.textContent = state.direction > 0 ? 'PUSH · 推' : 'PULL · 拉';
  }

  // —— Phone tilt as bellows ——
  let phoneOriActive = false;
  let baseBeta = null;

  function handlePhoneOri(e) {
    if (!state.playing) return;
    const beta = e.beta || 0;
    const gamma = e.gamma || 0;
    if (baseBeta === null) baseBeta = beta;
    // Use gamma (left-right tilt in portrait) as primary bellows, beta as backup
    let v = gamma / 35;
    if (Math.abs(gamma) < 4) v = (beta - baseBeta) / 40;
    v = Math.max(-1, Math.min(1, v));
    state.bellows = v;
    renderBellows();
    updateBellowsAudio();
  }

  // —— Smart ring ——
  let ringActive = false, ringFrame = 0, ringPrevBeta = null, ringPrevGamma = null;

  function setupRing() {
    if (typeof DeviceOrientationEvent === 'undefined') return;
    const b = document.getElementById('ring-status');
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      b.className = 'chip need';
      b.textContent = '💍 点击启用';
      b.onclick = async () => {
        try {
          const p = await DeviceOrientationEvent.requestPermission();
          if (p === 'granted') {
            ringActive = true;
            phoneOriActive = true;
            b.className = 'chip show active';
            b.textContent = '💍 已连接';
            b.onclick = null;
            window.addEventListener('deviceorientation', handleRing);
            window.addEventListener('deviceorientation', handlePhoneOri);
          }
        } catch (_) { b.textContent = '💍 不支持'; }
      };
    } else {
      ringActive = true;
      phoneOriActive = true;
      b.className = 'chip show active';
      b.textContent = '💍 已连接';
      window.addEventListener('deviceorientation', handleRing);
      window.addEventListener('deviceorientation', handlePhoneOri);
    }
  }

  function handleRing(e) {
    if (!ringActive || !state.playing) return;
    ringFrame++;
    if (ringFrame % 8 !== 0) return;
    const beta = e.beta || 0;
    const gamma = e.gamma || 0;
    if (ringPrevBeta === null) {
      ringPrevBeta = beta;
      ringPrevGamma = gamma;
      return;
    }
    const dBeta = Math.abs(beta - ringPrevBeta);
    const dGamma = Math.abs(gamma - ringPrevGamma);
    const dSigned = (beta - ringPrevBeta) + (gamma - ringPrevGamma);
    ringPrevBeta = beta;
    ringPrevGamma = gamma;

    // shake > 20° = sustain toggle / confirm
    if (dBeta > 20 || dGamma > 20) {
      toggleSustain();
      return;
    }
    // tilt > 5° = step melody selection
    if (dBeta > 5 || dGamma > 5) {
      const step = dSigned > 0 ? 1 : -1;
      const idx = Math.max(0, Math.min(MELODY.length - 1, state.ringNoteIdx + step));
      if (idx !== state.ringNoteIdx) {
        const prev = MELODY[state.ringNoteIdx];
        if (prev && melEls[prev.label] && !state.sustain) melEls[prev.label].classList.remove('on');
        state.ringNoteIdx = idx;
        const cur = MELODY[idx];
        if (cur && melEls[cur.label]) {
          melEls[cur.label].classList.add('on');
          flashNote(cur.label);
        }
      }
    }
  }

  // —— Smart cane ——
  let caneActive = false, caneFrame = 0, caneLastAccel = { x: 0, y: 0, z: 0 };
  let caneCooldown = 0;

  function setupCane() {
    if (typeof DeviceMotionEvent === 'undefined') return;
    const b = document.getElementById('cane-status');
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      b.className = 'chip need';
      b.textContent = '🦯 点击启用';
      b.onclick = async () => {
        try {
          const p = await DeviceMotionEvent.requestPermission();
          if (p === 'granted') {
            caneActive = true;
            b.className = 'chip show active';
            b.textContent = '🦯 已连接';
            b.onclick = null;
            window.addEventListener('devicemotion', handleCane);
          }
        } catch (_) { b.textContent = '🦯 不支持'; }
      };
    } else {
      caneActive = true;
      b.className = 'chip show active';
      b.textContent = '🦯 已连接';
      window.addEventListener('devicemotion', handleCane);
    }
  }

  function handleCane(e) {
    if (!caneActive || !state.playing) return;
    caneFrame++;
    if (caneFrame % 6 !== 0) return;
    const a = e.accelerationIncludingGravity || e.acceleration || { x: 0, y: 0, z: 0 };
    const ax = a.x || 0, ay = a.y || 0, az = a.z || 0;
    const dax = Math.abs(ax - caneLastAccel.x);
    const day = Math.abs(ay - caneLastAccel.y);
    const daz = Math.abs(az - caneLastAccel.z);
    caneLastAccel = { x: ax, y: ay, z: az };
    const now = performance.now();
    if (now < caneCooldown) return;

    // tap = accel spike > 8 → play selected melody note
    if (dax > 8 || day > 8 || daz > 8) {
      caneCooldown = now + 280;
      const n = MELODY[state.ringNoteIdx];
      if (!n) return;
      startNote('mel', n.label, [n.midi], false);
      if (melEls[n.label]) {
        melEls[n.label].classList.add('on');
        setTimeout(() => {
          if (!state.sustain) {
            melEls[n.label].classList.remove('on');
            stopNote('mel', n.label);
          }
        }, 220);
      }
      return;
    }

    // swing > 3 → bellows motion or octave
    const swing = Math.max(dax, day, daz);
    if (swing > 3) {
      const signed = (ax + ay) > 0 ? 1 : -1;
      if (swing > 5.5) {
        // strong swing: octave shift
        caneCooldown = now + 400;
        setOctave(state.octave + signed);
      } else {
        state.bellows = Math.max(-1, Math.min(1, state.bellows + signed * 0.18));
        renderBellows();
        updateBellowsAudio();
      }
    }
  }

  function setOctave(v) {
    state.octave = Math.max(-1, Math.min(2, v));
    document.getElementById('oct-chip').textContent = '八度 ' + (state.octave >= 0 ? '+' : '') + state.octave;
  }

  function toggleSustain() {
    state.sustain = !state.sustain;
    const chip = document.getElementById('sus-chip');
    const btn = document.getElementById('btn-sustain');
    chip.textContent = state.sustain ? '持续 开' : '持续 关';
    btn.classList.toggle('on', state.sustain);
    if (!state.sustain) stopAll();
  }

  // —— Motion permission (iOS combined) ——
  async function requestMotion() {
    ensureAudio();
    if (ctx.state === 'suspended') await ctx.resume();
    const btn = document.getElementById('btn-motion');
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        const p = await DeviceOrientationEvent.requestPermission();
        if (p === 'granted') {
          phoneOriActive = true;
          ringActive = true;
          window.addEventListener('deviceorientation', handlePhoneOri);
          window.addEventListener('deviceorientation', handleRing);
          const rb = document.getElementById('ring-status');
          rb.className = 'chip show active';
          rb.textContent = '💍 已连接';
          rb.onclick = null;
        }
      } else if (typeof DeviceOrientationEvent !== 'undefined') {
        phoneOriActive = true;
        window.addEventListener('deviceorientation', handlePhoneOri);
      }
      if (typeof DeviceMotionEvent !== 'undefined' &&
          typeof DeviceMotionEvent.requestPermission === 'function') {
        const p2 = await DeviceMotionEvent.requestPermission();
        if (p2 === 'granted') {
          caneActive = true;
          window.addEventListener('devicemotion', handleCane);
          const cb = document.getElementById('cane-status');
          cb.className = 'chip show active';
          cb.textContent = '🦯 已连接';
          cb.onclick = null;
        }
      } else if (typeof DeviceMotionEvent !== 'undefined') {
        caneActive = true;
        window.addEventListener('devicemotion', handleCane);
      }
      btn.textContent = '传感器已就绪';
    } catch (_) {
      btn.textContent = '传感器不可用';
    }
  }

  // —— Keyboard fallback ——
  const KEY_MEL = {
    '1': 0, '2': 1, '3': 2, '4': 3, '5': 4, '6': 5, '7': 6, '8': 7,
    'q': 8, 'w': 9, 'e': 10, 'r': 11,
  };
  const KEY_BASS = {
    'z': 0, 'x': 1, 'c': 2, 'v': 3, 'a': 4, 's': 5, 'd': 6, 'f': 7,
  };
  const heldKeys = new Set();

  window.addEventListener('keydown', e => {
    if (!state.playing || e.repeat) return;
    const k = e.key.toLowerCase();
    if (heldKeys.has(k)) return;
    heldKeys.add(k);

    if (k === ' ') { e.preventDefault(); toggleSustain(); return; }
    if (k === 'arrowup') { setOctave(state.octave + 1); return; }
    if (k === 'arrowdown') { setOctave(state.octave - 1); return; }
    if (k === 'arrowleft') {
      state.bellows = Math.max(-1, state.bellows - 0.25);
      renderBellows(); updateBellowsAudio(); return;
    }
    if (k === 'arrowright') {
      state.bellows = Math.min(1, state.bellows + 0.25);
      renderBellows(); updateBellowsAudio(); return;
    }

    if (KEY_MEL[k] !== undefined) {
      const n = MELODY[KEY_MEL[k]];
      if (n) {
        state.ringNoteIdx = KEY_MEL[k];
        melEls[n.label]?.classList.add('on');
        startNote('mel', n.label, [n.midi], false);
      }
      return;
    }
    if (KEY_BASS[k] !== undefined) {
      const b = BASS[KEY_BASS[k]];
      if (b) {
        bassEls[b.id]?.classList.add('on');
        startNote('bass', b.id, b.notes, true);
      }
    }
  });

  window.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    heldKeys.delete(k);
    if (KEY_MEL[k] !== undefined) {
      const n = MELODY[KEY_MEL[k]];
      if (n) {
        melEls[n.label]?.classList.remove('on');
        stopNote('mel', n.label);
      }
    }
    if (KEY_BASS[k] !== undefined) {
      const b = BASS[KEY_BASS[k]];
      if (b) {
        bassEls[b.id]?.classList.remove('on');
        stopNote('bass', b.id);
      }
    }
  });

  // Desktop mouse bellows: drag on accordion
  const accordion = document.getElementById('accordion');
  let dragX = null;
  accordion.addEventListener('pointerdown', e => {
    dragX = e.clientX;
    accordion.setPointerCapture(e.pointerId);
  });
  accordion.addEventListener('pointermove', e => {
    if (dragX === null) return;
    const dx = (e.clientX - dragX) / 80;
    state.bellows = Math.max(-1, Math.min(1, dx));
    renderBellows();
    updateBellowsAudio();
  });
  accordion.addEventListener('pointerup', () => { dragX = null; });
  accordion.addEventListener('pointercancel', () => { dragX = null; });

  // —— Start ——
  document.getElementById('btn-start').addEventListener('click', async () => {
    ensureAudio();
    if (ctx.state === 'suspended') await ctx.resume();
    state.playing = true;
    document.getElementById('start').classList.add('hidden');
    document.getElementById('play').classList.add('on');
    state.bellows = 0;
    renderBellows();
    updateBellowsAudio();
    // No idle auto-sway — real accordion needs push/pull for air
  });

  document.getElementById('btn-motion').addEventListener('click', requestMotion);
  document.getElementById('btn-sustain').addEventListener('click', toggleSustain);
  document.getElementById('btn-oct-up').addEventListener('click', () => setOctave(state.octave + 1));
  document.getElementById('btn-oct-down').addEventListener('click', () => setOctave(state.octave - 1));

  setupRing();
  setupCane();
  renderBellows();
})();
</script>
</body>
</html>
